<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" fill="none">
  <defs>
    <linearGradient id="nightWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#13192c"/>
      <stop offset="100%" stop-color="#1f273d"/>
    </linearGradient>
    <radialGradient id="deskCone" cx="48%" cy="48%" r="54%">
      <stop offset="0%" stop-color="#ffd285" stop-opacity="0.72"/>
      <stop offset="55%" stop-color="#d48948" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#1c2235" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="800" fill="url(#nightWall)"/>
  <!-- Rain-streaked studio window -->
  <rect x="64" y="64" width="290" height="370" fill="#20304f" stroke="#101524" stroke-width="8"/>
  <line x1="209" y1="64" x2="209" y2="434" stroke="#101524" stroke-width="6"/>
  <line x1="64" y1="248" x2="354" y2="248" stroke="#101524" stroke-width="6"/>
  <g stroke="#80a4cc" stroke-width="2" opacity="0.4" stroke-linecap="round">
    <line x1="108" y1="98" x2="94" y2="146"/>
    <line x1="158" y1="168" x2="144" y2="218"/>
    <line x1="264" y1="106" x2="246" y2="178"/>
    <line x1="306" y1="274" x2="288" y2="342"/>
    <line x1="128" y1="290" x2="112" y2="354"/>
  </g>
  <!-- Wooden desk surface -->
  <polygon points="0,530 600,490 600,800 0,800" fill="#462d24"/>
  <line x1="0" y1="530" x2="600" y2="490" stroke="#1f1310" stroke-width="5"/>
  <!-- Lamp glow pool -->
  <rect width="600" height="800" fill="url(#deskCone)"/>
  <!-- Open sketchbook -->
  <polygon points="124,606 382,566 476,684 188,742" fill="#f7f0df" stroke="#1e1714" stroke-width="4"/>
  <line x1="252" y1="586" x2="332" y2="712" stroke="#c8bfa8" stroke-width="3"/>
  <!-- Loose ink sketch inside sketchbook -->
  <path d="M188,638 Q226,612 248,654 Q212,672 195,692" stroke="#362f2b" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="352" cy="634" r="24" stroke="#362f2b" stroke-width="2.5" stroke-dasharray="4 4"/>
  <!-- Brass articulated lamp -->
  <path d="M474,524 L524,524 L516,544 L482,544 Z" fill="#b38246" stroke="#1b1410" stroke-width="3.5"/>
  <path d="M500,524 L538,370 L398,274" stroke="#b38246" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M500,524 L538,370 L398,274" stroke="#1b1410" stroke-width="2.5" fill="none"/>
  <path d="M356,288 L428,236 L444,296 L362,324 Z" fill="#d49e54" stroke="#1b1410" stroke-width="4"/>
  <!-- Ceramic mug & ink bottle -->
  <rect x="462" y="576" width="54" height="58" rx="8" fill="#8b4d47" stroke="#1b1410" stroke-width="3.5"/>
  <path d="M516,590 C534,590 534,620 516,620" stroke="#1b1410" stroke-width="4" fill="none"/>
  <rect x="92" y="544" width="38" height="44" rx="6" fill="#212d42" stroke="#101524" stroke-width="3.5"/>
  <rect x="102" y="530" width="18" height="14" fill="#101524"/>
  <!-- Dip pen -->
  <line x1="158" y1="546" x2="254" y2="572" stroke="#8c5438" stroke-width="5" stroke-linecap="round"/>
</svg>
