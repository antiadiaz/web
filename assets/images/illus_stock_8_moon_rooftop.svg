  <circle cx="302" cy="374" r="28" fill="#f3d6c8" stroke="#151010" stroke-width="3"/>
  <circle cx="310" cy="374" r="10" stroke="#151010" stroke-width="2.5"/>
  <path d="M266,406 C284,394 316,394 334,406 L342,476 L262,476 Z" fill="#c77858" stroke="#151010" stroke-width="3.5"/>
  <!-- Tiny spacesuit companion sitting beside -->
