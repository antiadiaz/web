<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" fill="none">
  <defs>
    <linearGradient id="moonSky" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#0f1529"/>
      <stop offset="60%" stop-color="#1e2948"/>
      <stop offset="100%" stop-color="#2e3b5c"/>
    </linearGradient>
    <radialGradient id="crescentGlow" cx="68%" cy="28%" r="36%">
      <stop offset="0%" stop-color="#fff0c4" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#fff0c4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="700" height="700" fill="url(#moonSky)"/>
  <rect width="700" height="700" fill="url(#crescentGlow)"/>
  <!-- Giant crescent moon -->
  <circle cx="482" cy="196" r="88" fill="#faecc8"/>
  <circle cx="516" cy="176" r="78" fill="#17203d"/>
  <!-- Quiet stars -->
