    <rect x="520" y="390" width="180" height="310"/>
  </g>
  <g fill="#f0c478" opacity="0.72">
    <rect x="38" y="462" width="24" height="32" rx="3"/>
    <rect x="92" y="462" width="24" height="32" rx="3"/>
    <rect x="564" y="438" width="24" height="32" rx="3"/>
    <rect x="618" y="492" width="24" height="32" rx="3"/>
