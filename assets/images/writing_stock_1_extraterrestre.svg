      <stop offset="100%" stop-color="#ece6da"/>
    </linearGradient>
    <radialGradient id="halo1" cx="50%" cy="38%" r="45%">
      <stop offset="0%" stop-color="#d7ccb8" stop-opacity="0.38"/>
