<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" fill="none">
  <defs>
    <linearGradient id="plumSky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#221933"/>
      <stop offset="55%" stop-color="#2c2440"/>
      <stop offset="100%" stop-color="#172436"/>
    </linearGradient>
    <radialGradient id="firefly" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe794" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffe794" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="800" fill="url(#plumSky)"/>
  <!-- Midnight botanical leaves -->
  <g fill="#19303b" stroke="#0d1a21" stroke-width="3">
    <path d="M-20,660 C80,530 140,420 120,260 C72,380 20,490 -20,660 Z"/>
    <path d="M620,640 C510,510 470,370 500,220 C542,350 580,480 620,640 Z"/>
    <path d="M30,190 C120,260 190,260 240,180 C165,160 95,165 30,190 Z"/>
    <path d="M570,175 C490,235 420,235 370,155 C445,140 510,148 570,175 Z"/>
  </g>
  <!-- Flowing wavy dark hair -->
  <path d="M210,275 C140,300 125,445 152,585 L448,585 C475,445 460,300 390,275 C352,225 248,225 210,275 Z" fill="#1e1829" stroke="#100c17" stroke-width="4"/>
