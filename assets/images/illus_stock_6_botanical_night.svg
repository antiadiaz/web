  <path d="M168,548 C210,502 390,502 432,548 L462,800 L138,800 Z" fill="#824d5c" stroke="#221319" stroke-width="4"/>
  <path d="M216,522 Q300,564 384,522 Q370,578 300,586 Q230,578 216,522 Z" fill="#c78367" stroke="#221319" stroke-width="3.5"/>
  <!-- Face -->
  <rect x="278" y="454" width="44" height="62" rx="18" fill="#e8c3b8" stroke="#221319" stroke-width="3.5"/>
  <path d="M236,356 C236,296 364,296 364,356 C364,424 334,474 300,474 C266,474 236,424 236,356 Z" fill="#f1cfc3" stroke="#221319" stroke-width="3.5"/>
  <!-- Warm rim highlight along cheek -->
  <path d="M350,350 C354,398 334,442 308,464" stroke="#ffe1b0" stroke-width="3.5" opacity="0.45" stroke-linecap="round"/>
  <!-- Contemplative eyes & brows -->
  <path d="M256,368 Q272,360 286,368" stroke="#221319" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M314,368 Q328,360 344,368" stroke="#221319" stroke-width="3" fill="none" stroke-linecap="round"/>
  <ellipse cx="272" cy="382" rx="7" ry="4.5" fill="#2b2029"/>
  <ellipse cx="328" cy="382" rx="7" ry="4.5" fill="#2b2029"/>
  <path d="M298,386 Q304,404 295,410" stroke="#9e645b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M286,432 Q300,439 314,432" stroke="#854444" stroke-width="3" stroke-linecap="round"/>
  <!-- Glowing fireflies -->
  <circle cx="132" cy="284" r="28" fill="url(#firefly)"/>
  <circle cx="132" cy="284" r="4" fill="#fff6cc"/>
  <circle cx="478" cy="338" r="32" fill="url(#firefly)"/>
  <circle cx="478" cy="338" r="4.5" fill="#fff6cc"/>
  <circle cx="412" cy="196" r="22" fill="url(#firefly)"/>
  <circle cx="412" cy="196" r="3" fill="#fff6cc"/>
  <circle cx="164" cy="494" r="24" fill="url(#firefly)"/>
  <circle cx="164" cy="494" r="3.5" fill="#fff6cc"/>
</svg>
