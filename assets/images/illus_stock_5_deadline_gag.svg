<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <rect width="800" height="600" fill="#efe9db"/>
  <rect x="24" y="24" width="752" height="552" fill="#fcfaf4" stroke="#151515" stroke-width="6"/>
  <!-- Desk edge -->
  <line x1="24" y1="448" x2="776" y2="448" stroke="#151515" stroke-width="6"/>
  <!-- Comical tower of sketchbooks & papers -->
  <g stroke="#151515" stroke-width="4" fill="#ffffff">
    <rect x="116" y="408" width="150" height="40"/>
    <rect x="128" y="370" width="136" height="38"/>
    <rect x="108" y="332" width="154" height="38"/>
    <rect x="134" y="294" width="128" height="38"/>
    <rect x="118" y="256" width="142" height="38"/>
  </g>
  <!-- Crumpled paper balls -->
  <circle cx="94" cy="432" r="14" fill="#ffffff" stroke="#151515" stroke-width="3.5"/>
  <path d="M88,426 L98,434 M98,425 L90,438" stroke="#151515" stroke-width="2.5"/>
  <circle cx="678" cy="432" r="16" fill="#ffffff" stroke="#151515" stroke-width="3.5"/>
  <!-- Stacked espresso cups -->
  <path d="M590,448 L602,396 L646,396 L658,448 Z" fill="#151515"/>
  <path d="M598,396 L608,348 L642,348 L650,396 Z" fill="#ffffff" stroke="#151515" stroke-width="4"/>
  <!-- Exhausted wide-eyed illustrator character leaning on desk -->
  <path d="M352,276 C312,268 292,316 308,346 C288,370 302,424 338,446 L464,446 C496,422 504,368 484,344 C504,314 484,268 442,276 Z" fill="#151515"/>
  <ellipse cx="396" cy="364" rx="64" ry="56" fill="#ffffff" stroke="#151515" stroke-width="5"/>
  <!-- Massive tired staring eyes -->
  <circle cx="372" cy="356" r="22" fill="#ffffff" stroke="#151515" stroke-width="4.5"/>
  <circle cx="422" cy="356" r="22" fill="#ffffff" stroke="#151515" stroke-width="4.5"/>
  <circle cx="372" cy="356" r="4" fill="#151515"/>
  <circle cx="422" cy="356" r="4" fill="#151515"/>
  <path d="M356,386 Q372,392 388,386" stroke="#151515" stroke-width="2.5" fill="none"/>
  <path d="M406,386 Q422,392 438,386" stroke="#151515" stroke-width="2.5" fill="none"/>
  <path d="M380,404 L412,404" stroke="#151515" stroke-width="4" stroke-linecap="round"/>
  <!-- 3:00 AM digital clock bubble -->
  <rect x="526" y="138" width="160" height="72" rx="12" fill="#ffffff" stroke="#151515" stroke-width="4.5"/>
  <text x="606" y="186" text-anchor="middle" font-family="Inter, sans-serif" font-weight="700" font-size="34" fill="#151515">03:00</text>
  <!-- Glowing stylus -->
  <line x1="478" y1="398" x2="544" y2="438" stroke="#151515" stroke-width="6" stroke-linecap="round"/>
</svg>
